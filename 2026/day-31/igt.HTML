<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India\'s Got Latent - Fan Video Gallery</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111;color:#fff}
header{background:#e50914;padding:4px;text-align:center;font-size:28px;font-weight:bold}
.search{padding:20px;text-align:center}
.search input{width:60%;padding:12px;border-radius:8px;border:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:20px}
.card{background:#1c1c1c;border-radius:12px;overflow:hidden;transition:.3s;cursor:pointer}
.card:hover{transform:scale(1.03)}
.card img{width:100%;height:180px;object-fit:cover}
.card h3{padding:10px;margin:0}
.card p{padding:0 10px 15px;color:#bbb}
footer{text-align:center;padding:20px;color:#888}
</style>
</head>
<body>
<!-- <header>India's Got Latent </header> -->
<header>
    <img
        src="https://play-lh.googleusercontent.com/Q2onkDKnqk8CeEjY0NlfGDgDl4bD6vr1u7efkK-ct1puZ2KkXzm-4JlWoUMPQjLVTmg=w3840-h2160-rw"
        alt="India's Got Latent Banner"
        style="
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        "
    >
</header>
<div class="search">
<input type="text" id="search" placeholder="Search episodes..." onkeyup="filterCards()">
</div>
<div class="grid" id="videoGrid">
<div class="card"><img src="https://m.media-amazon.com/images/M/MV5BN2YzMjhlNTAtYzRjZC00NDEzLWJkYjctN2NkYmQ5MjhlOWM4XkEyXkFqcGc@._V1_.jpg" alt="Thumbnail"><h3>Episode 1</h3><p>The one with Raftar</p></div>
<div class="card"><img src="https://m.media-amazon.com/images/M/MV5BYWRmZWRmNjYtNmJiMi00ZGNlLTk4OTYtZjFkMThhM2E5NTQ5XkEyXkFqcGc@._V1_.jpg" alt="Thumbnail"><h3>Episode 2</h3><p>Urvi Special</p></div>
<div class="card"><img src="https://media.licdn.com/dms/image/v2/D4D12AQHvtHBMKfEvSA/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1732136202870?e=2147483647&v=beta&t=ce3wkcR7uFZ9v5UecFG0we0zwiA3vRq14zKORJ-SK_E" alt="Thumbnail"><h3>Episode 3</h3><p>Maheep's Side of the Story</p></div>
<div class="card"><img src="https://m.media-amazon.com/images/M/MV5BZGI0NjE2NGQtZDQzOC00ZmU1LTg5MzMtNmQ4YjQ1OTYwNDUzXkEyXkFqcGc@._V1_.jpg" alt="Thumbnail"><h3>Episode 4</h3><p>Bharti-ing Hard</p></div>
<div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQK59CO19qtHlQxFa8ZyGURGMuUhEtftpcHu14juc-H9Q&s=10" alt="Thumbnail"><h3>Episode 5</h3><p>Grand Highlights</p></div>
<div class="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHvfbT66GSg7LoG_GWVkCChSghhyYcPSogIuHlqK_YKaU3dd_4OHEkQ2yT&s=10" alt="Thumbnail"><h3>Episode 6</h3><p>Endgame</p></div>
</div>
<footer>Fan-made frontend concept for browsing episode thumbnails.</footer>
<script>
function filterCards(){
 const input=document.getElementById('search').value.toLowerCase();
 const cards=document.querySelectorAll('.card');
 cards.forEach(card=>{
   card.style.display=card.innerText.toLowerCase().includes(input)?'block':'none';
 });
}
</script>
</body>
</html>
