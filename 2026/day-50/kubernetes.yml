kubectl apply --server-side -f https://github.com
kubectl apply -f 

# 1. Install Gateway API CRDs (one-time, standard channel)
kubectl apply --server-side -f https://github.com

# 2. Create the Gateway Infrastructure
kubectl apply -f - <<EOF
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
spec:
  gatewayClassName: cilium # change to your controller's class if not using Cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
EOF

# 3. Create HTTPRoute for Traffic Routing
kubectl apply -f - <<EOF
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop-routes
spec:
  parentRefs:
    - name: my-gateway
  hostnames:
    - "shop.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cart
      backendRefs:
        - name: cart-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /pay
      backendRefs:
        - name: checkout-service
          port: 80


